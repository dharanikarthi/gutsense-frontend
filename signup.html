<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GutSense</title>
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <div class="app-logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
                <h1 class="app-name">GutSense</h1>
                <p class="app-tagline">Join the AI-powered gut health revolution</p>
            </div>

            <form class="auth-form">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" name="terms" required>
                        <span class="checkmark"></span>
                        I agree to the terms
                    </label>
                </div>

                <button type="button" class="primary-button" onclick="createAccount()">Create Account</button>
            </form>

            <div class="security-note">
                <p>🔒 Your data is securely stored and synced across devices.</p>
            </div>

            <div class="auth-footer">
                <p>Already have an account? <a href="signin.html" class="link">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        function createAccount() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
